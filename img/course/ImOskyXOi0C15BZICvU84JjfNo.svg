<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="400" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Who is responsible for what</text><rect width="320" height="290" x="40" y="80" fill="#13294B" rx="12"/><text x="64" y="120" fill="#FF6B35" font-size="20" font-weight="700">Owner / lessor</text><text x="64" y="144" fill="#C9D3E0" font-size="14">usually through the property manager</text><text x="64" y="186" fill="#fff" font-size="15">• Test and clean every alarm</text><text x="78" y="207" fill="#fff" font-size="15">within 30 days before a tenancy</text><text x="78" y="228" fill="#fff" font-size="15">starts or is renewed</text><text x="64" y="262" fill="#fff" font-size="15">• Replace flat or nearly flat</text><text x="78" y="283" fill="#fff" font-size="15">removable batteries</text><text x="64" y="317" fill="#fff" font-size="15">• Replace any alarm that fails</text><text x="78" y="338" fill="#fff" font-size="15">or is 10 or more years old</text><rect width="320" height="290" x="380" y="80" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="12"/><text x="404" y="120" fill="#13294B" font-size="20" font-weight="700">Tenant</text><text x="404" y="144" fill="#4A5A70" font-size="14">during the tenancy</text><text x="404" y="186" fill="#13294B" font-size="15">• Test and clean the alarms</text><text x="418" y="207" fill="#13294B" font-size="15">at least once every 12 months</text><text x="404" y="241" fill="#13294B" font-size="15">• Replace flat batteries</text><text x="418" y="262" fill="#13294B" font-size="15">in older alarms</text><text x="404" y="296" fill="#13294B" font-size="15">• Tell the property manager</text><text x="418" y="317" fill="#13294B" font-size="15">about any fault straight away</text><rect width="320" height="290" x="720" y="80" fill="#fff" stroke="#FF6B35" stroke-width="2" rx="12"/><text x="744" y="120" fill="#13294B" font-size="20" font-weight="700">Everyone</text><text x="744" y="144" fill="#4A5A70" font-size="14">owner, manager, tenant, visitors</text><text x="744" y="186" fill="#13294B" font-size="15">• Never remove an alarm or</text><text x="758" y="207" fill="#13294B" font-size="15">its battery, except to replace it</text></svg>