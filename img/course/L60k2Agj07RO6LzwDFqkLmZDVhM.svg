<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="470" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Choosing the result</text><rect width="330" height="110" x="40" y="90" fill="#fff" stroke="#13294B" stroke-width="2" rx="10"/><text x="60" y="125" fill="#13294B" font-size="15" font-weight="700">Is every alarm present, compliant</text><text x="60" y="145.25" fill="#13294B" font-size="15" font-weight="700">and did each one pass every check?</text><path stroke="#1E8E5A" stroke-width="2.5" d="M370 145h330"/><path fill="#1E8E5A" d="m700 145-8.104 3.915v-7.83Z"/><text x="535" y="135" fill="#1E8E5A" font-size="14" font-weight="700" text-anchor="middle">Yes</text><rect width="330" height="110" x="710" y="90" fill="#1E8E5A" rx="10"/><text x="730" y="128" fill="#fff" font-size="18" font-weight="700">All OK</text><text x="730" y="155" fill="#fff" font-size="13">Nothing to do. The record is</text><text x="730" y="172.55" fill="#fff" font-size="13">kept as proof of the check.</text><path stroke="#D64545" stroke-width="2.5" d="M205 200v50"/><path fill="#D64545" d="m205 250-3.915-8.104h7.83Z"/><text x="220" y="232" fill="#D64545" font-size="14" font-weight="700">No</text><rect width="330" height="175" x="40" y="255" fill="#fff" stroke="#13294B" stroke-width="2" rx="10"/><text x="60" y="285" fill="#13294B" font-size="15" font-weight="700">Is any of these true?</text><text x="60" y="312" fill="#4A5A70" font-size="13">• An alarm is missing or failed</text><text x="60" y="332.8" fill="#4A5A70" font-size="13">• Alarms aren’t interconnected</text><text x="60" y="353.6" fill="#4A5A70" font-size="13">• An ionisation or expired alarm</text><text x="60" y="374.4" fill="#4A5A70" font-size="13">• A damaged hardwired alarm</text><path stroke="#D64545" stroke-width="2.5" d="M370 300h330"/><path fill="#D64545" d="m700 300-8.104 3.915v-7.83Z"/><text x="535" y="290" fill="#D64545" font-size="14" font-weight="700" text-anchor="middle">Yes</text><rect width="330" height="100" x="710" y="250" fill="#D64545" rx="10"/><text x="730" y="285" fill="#fff" font-size="18" font-weight="700">Full inspection needed</text><text x="730" y="310" fill="#fff" font-size="13">Tell the owner the same day and</text><text x="730" y="327.55" fill="#fff" font-size="13">arrange an electrician.</text><path stroke="#E89B1C" stroke-width="2.5" d="M370 395h330"/><path fill="#E89B1C" d="m700 395-8.104 3.915v-7.83Z"/><text x="535" y="385" fill="#E89B1C" font-size="14" font-weight="700" text-anchor="middle">No</text><rect width="330" height="80" x="710" y="360" fill="#E89B1C" rx="10"/><text x="730" y="392" fill="#fff" font-size="18" font-weight="700">Minor fix needed</text><text x="730" y="418" fill="#fff" font-size="13">Let the owner know and agree a date.</text></svg>