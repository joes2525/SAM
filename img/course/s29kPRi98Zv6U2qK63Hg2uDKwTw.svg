<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="300" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Queensland smoke alarm law: key dates</text><path stroke="#C9D3E0" stroke-linecap="round" stroke-width="6" d="M120 150h840"/><path stroke="#13294B" stroke-linecap="round" stroke-width="6" d="M120 150h420"/><g text-anchor="middle"><circle cx="120" cy="150" r="18" fill="#13294B"/><text x="120" y="110" fill="#13294B" font-size="20" font-weight="700">1 Jan 2017</text><text x="120" y="210" fill="#13294B" font-size="17" font-weight="600">Law starts</text><text x="120" y="236" fill="#4A5A70" font-size="15">New homes and</text><text x="120" y="258" fill="#4A5A70" font-size="15">major renovations</text><circle cx="540" cy="150" r="24" fill="#FF6B35"/><circle cx="540" cy="150" r="10" fill="#fff"/><text x="540" y="110" fill="#FF6B35" font-size="20" font-weight="700">1 Jan 2022</text><text x="540" y="210" fill="#13294B" font-size="17" font-weight="600">Rentals and sales</text><text x="540" y="236" fill="#4A5A70" font-size="15">Every new or renewed lease,</text><text x="540" y="258" fill="#4A5A70" font-size="15">and every home sold</text><circle cx="960" cy="150" r="18" fill="#fff" stroke="#13294B" stroke-width="5"/><text x="960" y="110" fill="#13294B" font-size="20" font-weight="700">1 Jan 2027</text><text x="960" y="210" fill="#13294B" font-size="17" font-weight="600">Every home</text><text x="960" y="236" fill="#4A5A70" font-size="15">All Queensland homes,</text><text x="960" y="258" fill="#4A5A70" font-size="15">including owner occupied</text></g></svg>