="230" r="16" fill="#FF6B35" opacity=".22"/><circle cx="135" cy="230" r="9" fill="#fff" stroke="#FF6B35" stroke-width="3"/><circle cx="135" cy="230" r="3.5" fill="#FF6B35"/><circle cx="395" cy="215" r="16" fill="#FF6B35" opacity=".22"/><circle cx="395" cy="215" r="9" fill="#fff" stroke="#FF6B35" stroke-width="3"/><circle cx="395" cy="215" r="3.5" fill="#FF6B35"/><circle cx="565" cy="230" r="16" fill="#FF6B35" opacity=".22"/><circle cx="565" cy="230" r="9" fill="#fff" stroke="#FF6B35" stroke-width="3"/><circle cx="565" cy="230" r="3.5" fill="#FF6B35"/><circle cx="300" cy="290" r="16" fill="#FF6B35" opacity=".22"/><circle cx="300" cy="290" r="9" fill="#fff" stroke="#FF6B35" stroke-width="3"/><circle cx="300" cy="290" r="3.5" fill="#FF6B35"/><circle cx="530" cy="415" r="9" fill="#fff" stroke="#D64545" stroke-dasharray="3 3" stroke-width="3"/><path stroke="#D64545" stroke-linecap="round" stroke-width="3" d="m518 403 24 24m0-24-24 24"/><text x="548" y="412" fill="#D64545" font-size="11" font-weight="700">NOT IN THE</text><text x="548" y="426" fill="#D64545" font-size="11" font-weight="700">KITCHEN</text><rect width="360" height="380" x="680" y="110" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="10"/><text x="702" y="145" fill="#13294B" font-size="18" font-weight="700">4 alarms needed</text><text x="702" y="180" fill="#13294B" font-size="14" font-weight="700">Bedroom 1 and bedroom 2</text><text x="702" y="202" fill="#4A5A70" font-size="14">1 alarm each</text><text x="702" y="232" fill="#13294B" font-size="14" font-weight="700">Study</text><text x="702" y="254" fill="#4A5A70" font-size="14">Has a sofa bed, so it’s used for</text><text x="702" y="276" fill="#4A5A70" font-size="14">sleeping. Treat it as a bedroom:</text><text x="702" y="298" fill="#4A5A70" font-size="14">1 alarm.</text><text x="702" y="328" fill="#13294B" font-size="14" font-weight="700">Hallway</text><text x="702" y="350" fill="#4A5A70" font-size="14">1 alarm, between the bedrooms</text><text x="702" y=