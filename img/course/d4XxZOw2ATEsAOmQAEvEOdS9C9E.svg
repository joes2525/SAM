<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="400" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Keep clear: flat and sloping ceilings</text><text x="40" y="90" fill="#13294B" font-size="16" font-weight="700">Flat ceiling (looking up)</text><path fill="#fff" stroke="#13294B" stroke-width="3" d="M40 105h480v270H40z"/><path fill="none" stroke="#FF6B35" stroke-dasharray="6 5" stroke-width="2" d="M70 135h420v210H70z"/><text x="80" y="155" fill="#FF6B35" font-size="13" font-weight="600">300 mm from walls</text><circle cx="150" cy="290" r="12" fill="#FFE08A" stroke="#13294B" stroke-width="2"/><circle cx="150" cy="290" r="40" fill="none" stroke="#4A5A70" stroke-dasharray="4 4" stroke-width="2"/><text x="150" y="243" fill="#4A5A70" font-size="12" font-weight="600" text-anchor="middle">Light: 300 mm</text><path fill="#E4E9F0" stroke="#13294B" stroke-width="2" d="M395 275h50v22h-50z"/><circle cx="420" cy="286" r="44" fill="none" stroke="#4A5A70" stroke-dasharray="4 4" stroke-width="2"/><text x="420" y="364" fill="#4A5A70" font-size="12" font-weight="600" text-anchor="middle">A/C vent: 400 mm</text><circle cx="410" cy="190" r="6" fill="#13294B"/><path stroke="#13294B" stroke-linecap="round" stroke-width="5" d="M385 190h50m-25-25v50"/><text x="410" y="155" fill="#4A5A70" font-size="12" font-weight="600" text-anchor="middle">Fan: 400 mm from blades</text><circle cx="265" cy="215" r="15" fill="#FF6B35" opacity=".25"/><circle cx="265" cy="215" r="8" fill="#FF6B35"/><text x="265" y="245" fill="#13294B" font-size="13" font-weight="700" text-anchor="middle">Alarm near centre</text><text x="580" y="90" fill="#13294B" font-size="16" font-weight="700">Sloping ceiling (side view)</text><path fill="#fff" stroke="#13294B" stroke-width="3" d="m600 350 210-200 210 200Z"/><path stroke="#D64545" stroke-linecap="round" stroke-width="7" d="m810 150-42 40m42-40 42 40"/><path stroke="#1E8E5A" stroke-linecap="round" stroke-width="7" d="m768 190-42 40m126-40 42 40"/><circle cx="747" cy="210" r="15" fill="#FF6B35" opacity=".25"/><circle cx="747" cy="210" r="8" fill="#FF6B35"/><text x="810" y="130" fill="#D64545" font-size="13" font-weight="700" text-anchor="middle">Not within 300 mm of the apex</text><text x="810" y="290" fill="#1E8E5A" font-size="13" font-weight="700" text-anchor="middle">Alarm goes in the green zone:</text><text x="810" y="308" fill="#1E8E5A" font-size="13" text-anchor="middle">within 500 mm of the highest point</text></svg>