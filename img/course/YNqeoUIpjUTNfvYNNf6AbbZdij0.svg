<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="420" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Pass or fail: the five checks</text><text x="260" y="100" fill="#1E8E5A" font-size="15" font-weight="700">Passes</text><text x="660" y="100" fill="#D64545" font-size="15" font-weight="700">Fails</text><rect width="1000" height="48" x="40" y="118" fill="#fff" rx="8"/><text x="60" y="148" fill="#13294B" font-size="16" font-weight="700">Type</text><circle cx="240" cy="142" r="13" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m234 142 4 5 8-10"/><text x="262" y="148" fill="#13294B" font-size="15">Photoelectric</text><circle cx="640" cy="142" r="13" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="3" d="m635 137 10 10m0-10-10 10"/><text x="662" y="148" fill="#13294B" font-size="15">Ionisation</text><rect width="1000" height="48" x="40" y="176" fill="#fff" rx="8"/><text x="60" y="206" fill="#13294B" font-size="16" font-weight="700">Standard</text><circle cx="240" cy="200" r="13" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m234 200 4 5 8-10"/><text x="262" y="206" fill="#13294B" font-size="15">AS 3786-2014</text><circle cx="640" cy="200" r="13" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="3" d="m635 195 10 10m0-10-10 10"/><text x="662" y="206" fill="#13294B" font-size="15">AS 3786-1993 or older</text><rect width="1000" height="48" x="40" y="234" fill="#fff" rx="8"/><text x="60" y="264" fill="#13294B" font-size="16" font-weight="700">Power</text><circle cx="240" cy="258" r="13" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m234 258 4 5 8-10"/><text x="262" y="264" fill="#13294B" font-size="15">Mains or 10-year sealed battery</text><circle cx="640" cy="258" r="13" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="3" d="m635 253 10 10m0-10-10 10"/><text x="662" y="264" fill="#13294B" font-size="15">Replaceable 9V battery only</text><rect width="1000" height="48" x="40" y="292" fill="#fff" rx="8"/><text x="60" y="322" fill="#13294B" font-size="16" font-weight="700">Interconnected</text><circle cx="240" cy="316" r="13" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m234 316 4 5 8-10"/><text x="262" y="322" fill="#13294B" font-size="15">All alarms sound together</text><circle cx="640" cy="316" r="13" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="3" d="m635 311 10 10m0-10-10 10"/><text x="662" y="322" fill="#13294B" font-size="15">Each alarm sounds on its own</text><rect width="1000" height="48" x="40" y="350" fill="#fff" rx="8"/><text x="60" y="380" fill="#13294B" font-size="16" font-weight="700">Age</text><circle cx="240" cy="374" r="13" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m234 374 4 5 8-10"/><text x="262" y="380" fill="#13294B" font-size="15">Under 10 years from manufacture</text><circle cx="640" cy="374" r="13" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="3" d="m635 369 10 10m0-10-10 10"/><text x="662" y="380" fill="#13294B" font-size="15">10 years old or more</text></svg>