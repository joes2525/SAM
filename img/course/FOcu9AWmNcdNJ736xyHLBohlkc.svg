<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="420" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Reading the label on the back of an alarm</text><circle cx="300" cy="235" r="150" fill="#fff" stroke="#C9D3E0" stroke-width="3"/><circle cx="300" cy="235" r="132" fill="none" stroke="#E4E9F0" stroke-width="2"/><g text-anchor="middle"><text x="300" y="165" fill="#13294B" font-size="17" font-weight="700">PHOTOELECTRIC</text><text x="300" y="187" fill="#13294B" font-size="17" font-weight="700">SMOKE ALARM</text><text x="300" y="225" fill="#13294B" font-size="15">Complies with AS 3786-2014</text><text x="300" y="260" fill="#13294B" font-size="15">10 year lithium battery</text><text x="300" y="280" fill="#4A5A70" font-size="13">non-removable</text><text x="300" y="315" fill="#13294B" font-size="15" font-weight="700">MFD 03/2021</text></g><path stroke="#FF6B35" stroke-width="2" d="m385 176 225-66"/><circle cx="385" cy="176" r="5" fill="#FF6B35"/><text x="625" y="108" fill="#13294B" font-size="17" font-weight="700">Type</text><text x="625" y="130" fill="#4A5A70" font-size="14">must say photoelectric, not ionisation</text><path stroke="#FF6B35" stroke-width="2" d="m410 220 200-35"/><circle cx="410" cy="220" r="5" fill="#FF6B35"/><text x="625" y="183" fill="#13294B" font-size="17" font-weight="700">Standard</text><text x="625" y="205" fill="#4A5A70" font-size="14">must be AS 3786-2014</text><path stroke="#FF6B35" stroke-width="2" d="m405 262 205-2"/><circle cx="405" cy="262" r="5" fill="#FF6B35"/><text x="625" y="258" fill="#13294B" font-size="17" font-weight="700">Power</text><text x="625" y="280" fill="#4A5A70" font-size="14">10-year sealed battery or mains (240V)</text><path stroke="#FF6B35" stroke-width="2" d="m370 310 240 25"/><circle cx="370" cy="310" r="5" fill="#FF6B35"/><text x="625" y="333" fill="#13294B" font-size="17" font-weight="700">Manufacture date</text><text x="625" y="355" fill="#4A5A70" font-size="14">replace 10 years after this date</text></svg>