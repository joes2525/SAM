<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="330" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Stop: don’t touch the alarm if you see this</text><rect width="210" height="200" x="40" y="80" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="10"/><path stroke="#13294B" stroke-width="4" d="M115 98h60"/><path fill="none" stroke="#FF6B35" stroke-width="2.5" d="M137 98c-6 14 6 18 0 28m14-28c8 12-4 20 2 30"/><g transform="rotate(-18 145 148)"><circle cx="145" cy="148" r="24" fill="#fff" stroke="#13294B" stroke-width="3"/><circle cx="145" cy="148" r="13.2" fill="none" stroke="#C9D3E0" stroke-width="2"/><circle cx="145" cy="148" r="4.32" fill="#D64545"/></g><text x="145" y="215" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Hanging off the ceiling</text><text x="145" y="238" fill="#4A5A70" font-size="13" text-anchor="middle">or loose from its base</text><rect width="210" height="200" x="270" y="80" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="10"/><circle cx="375" cy="140" r="28" fill="#fff" stroke="#13294B" stroke-width="3"/><circle cx="375" cy="140" r="15.4" fill="none" stroke="#C9D3E0" stroke-width="2"/><circle cx="375" cy="140" r="5.04" fill="#D64545"/><ellipse cx="385" cy="132" fill="#5B3A1E" opacity=".65" rx="14" ry="9"/><ellipse cx="367" cy="150" fill="#5B3A1E" opacity=".5" rx="8" ry="5"/><text x="375" y="215" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Scorch marks</text><text x="375" y="238" fill="#4A5A70" font-size="13" text-anchor="middle">or melted plastic</text><rect width="210" height="200" x="500" y="80" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="10"/><circle cx="605" cy="146" r="26" fill="#fff" stroke="#13294B" stroke-width="3"/><circle cx="605" cy="146" r="14.3" fill="none" stroke="#C9D3E0" stroke-width="2"/><circle cx="605" cy="146" r="4.68" fill="#D64545"/><path fill="none" stroke="#4A5A70" stroke-linecap="round" stroke-width="2.5" d="M591 110q-6-8 0-16t0-16m14 32q-6-8 0-16t0-16m14 32q-6-8 0-16t0-16"/><text x="605" y="215" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Smells of burning</text><text x="605" y="238" fill="#4A5A70" font-size="13" text-anchor="middle">or is hot to the touch</text><path stroke="#13294B" stroke-width="2.5" d="M735 180h35"/><path fill="#13294B" d="m770 180-8.104 3.915v-7.83Z"/><rect width="260" height="200" x="780" y="80" fill="#D64545" rx="10"/><text x="800" y="125" fill="#fff" font-size="18" font-weight="700">Don’t touch it</text><text x="800" y="160" fill="#fff" font-size="14">Keep people away from it.</text><text x="800" y="178.9" fill="#fff" font-size="14">Note it on your check.</text><text x="800" y="197.8" fill="#fff" font-size="14">Arrange an electrician</text><text x="800" y="216.7" fill="#fff" font-size="14">urgently.</text></svg>