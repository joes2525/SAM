<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="320" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="320" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Power sources at a glance</text><rect width="320" height="210" x="40" y="80" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="10"/><circle cx="100" cy="150" r="30" fill="#fff" stroke="#13294B" stroke-width="3"/><circle cx="100" cy="150" r="16.5" fill="none" stroke="#C9D3E0" stroke-width="2"/><circle cx="100" cy="150" r="5.4" fill="#FF6B35"/><circle cx="332" cy="104" r="11" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m327 104 3.5 4 7-8"/><rect width="44" height="18" x="78" y="190" fill="#13294B" rx="9"/><text x="100" y="203" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">240V</text><text x="150" y="142" fill="#13294B" font-size="16" font-weight="700">Hardwired (240V)</text><text x="150" y="163" fill="#4A5A70" font-size="13">with a backup battery</text><text x="150" y="228" fill="#13294B" font-size="13">Replace the whole alarm</text><text x="150" y="245.55" fill="#13294B" font-size="13">10 years after manufacture</text><rect width="320" height="210" x="380" y="80" fill="#fff" stroke="#C9D3E0" stroke-width="2" rx="10"/><circle cx="440" cy="150" r="30" fill="#fff" stroke="#13294B" stroke-width="3"/><circle cx="440" cy="150" r="16.5" fill="none" stroke="#C9D3E0" stroke-width="2"/><circle cx="440" cy="150" r="5.4" fill="#FF6B35"/><circle cx="672" cy="104" r="11" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m667 104 3.5 4 7-8"/><rect width="44" height="18" x="418" y="190" fill="#13294B" rx="9"/><text x="440" y="203" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">10 YR</text><text x="490" y="142" fill="#13294B" font-size="16" font-weight="700">Sealed battery</text><text x="490" y="163" fill="#4A5A70" font-size="13">non-removable, 10-year</text><text x="490" y="228" fill="#13294B" font-size="13">Replace the whole alarm</text><text x="490" y="245.55" fill="#13294B" font-size="13">10 years after manufacture</text><rect width="320" height="210" x="720" y="80" fill="#fff" stroke="#D64545" stroke-width="2" rx="10"/><circle cx="780" cy="150" r="30" fill="#fff" stroke="#13294B" stroke-width="3"/><circle cx="780" cy="150" r="16.5" fill="none" stroke="#C9D3E0" stroke-width="2"/><circle cx="780" cy="150" r="5.4" fill="#D64545"/><circle cx="1012" cy="104" r="11" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.6" d="m1007.5 99.5 9 9m0-9-9 9"/><rect width="44" height="18" x="758" y="190" fill="#D64545" rx="9"/><text x="780" y="203" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">9V</text><text x="830" y="142" fill="#D64545" font-size="16" font-weight="700">9V battery only</text><text x="830" y="163" fill="#4A5A70" font-size="13">removable battery</text><text x="830" y="228" fill="#D64545" font-size="13" font-weight="700">Doesn’t meet the rules.</text><text x="830" y="245.55" fill="#D64545" font-size="13" font-weight="700">Replace a flat battery until</text><text x="830" y="263.1" fill="#D64545" font-size="13" font-weight="700">the alarm is replaced.</text></svg>