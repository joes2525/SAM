<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="400" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">Using a step ladder safely</text><path stroke="#4A5A70" stroke-width="3" d="M80 360h340"/><path stroke="#13294B" stroke-linecap="round" stroke-width="7" d="m170 358 60-253m60 253-50-253"/><path stroke="#4A5A70" stroke-linecap="round" stroke-width="5" d="m320 358-68-253"/><path stroke="#13294B" stroke-width="5" d="M180 315.833h101.667M190 273.667h83.333M200 231.5h65m-55-42.167h46.667M220 147.167h28.333"/><rect width="44" height="14" x="218" y="92" fill="#D64545" rx="3"/><path stroke="#D64545" stroke-width="6" d="M226 148h36"/><path stroke="#1E8E5A" stroke-width="4" d="M283 250h21"/><text x="330" y="100" fill="#D64545" font-size="13" font-weight="700">Top cap and top step: never stand here</text><path stroke="#D64545" stroke-width="2.5" d="m325 96-57 2"/><path fill="#D64545" d="m268 98 7.962-4.196.274 7.824Z"/><text x="330" y="255" fill="#1E8E5A" font-size="13" font-weight="700">Spreader locked</text><path stroke="#1E8E5A" stroke-width="2.5" d="M325 251h-18"/><path fill="#1E8E5A" d="m307 251 8.104-3.915v7.83Z"/><text x="250" y="385" fill="#4A5A70" font-size="13" font-weight="700" text-anchor="middle">Firm, level ground</text><text x="620" y="100" fill="#1E8E5A" font-size="16" font-weight="700">Do</text><circle cx="632" cy="127" r="11" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m627 127 3.5 4 7-8"/><text x="652" y="132" fill="#13294B" font-size="14">Use a test pole from the floor where you can</text><circle cx="632" cy="159" r="11" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m627 159 3.5 4 7-8"/><text x="652" y="164" fill="#13294B" font-size="14">Ladder fully opened and locked</text><circle cx="632" cy="191" r="11" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m627 191 3.5 4 7-8"/><text x="652" y="196" fill="#13294B" font-size="14">Firm, level ground</text><circle cx="632" cy="223" r="11" fill="#1E8E5A"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" d="m627 223 3.5 4 7-8"/><text x="652" y="228" fill="#13294B" font-size="14">Three points of contact: two feet, one hand</text><text x="620" y="272" fill="#D64545" font-size="16" font-weight="700">Don’t</text><circle cx="632" cy="299" r="11" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.6" d="m627.5 294.5 9 9m0-9-9 9"/><text x="652" y="304" fill="#13294B" font-size="14">Don’t stand on the top step or top cap</text><circle cx="632" cy="331" r="11" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.6" d="m627.5 326.5 9 9m0-9-9 9"/><text x="652" y="336" fill="#13294B" font-size="14">Don’t overreach: climb down and move the ladder</text><circle cx="632" cy="363" r="11" fill="#D64545"/><path stroke="#fff" stroke-linecap="round" stroke-width="2.6" d="m627.5 358.5 9 9m0-9-9 9"/><text x="652" y="368" fill="#13294B" font-size="14">Never stand on chairs, tables or beds</text></svg>