<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="270" font-family="Helvetica, Arial, sans-serif"><rect width="1080" height="270" fill="#F3F6FA" rx="14"/><text x="40" y="52" fill="#13294B" font-size="22" font-weight="700">The check, step by step</text><circle cx="110" cy="125" r="30" fill="#13294B"/><text x="110" y="134" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="110" y="190" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Look</text><text x="110" y="212" fill="#4A5A70" font-size="12" text-anchor="middle">Present, undamaged,</text><text x="110" y="229" fill="#4A5A70" font-size="12" text-anchor="middle">not painted or covered</text><path stroke="#C9D3E0" stroke-width="2.5" d="M148 125h96"/><path fill="#C9D3E0" d="m244 125-8.104 3.915v-7.83Z"/><circle cx="282" cy="125" r="30" fill="#13294B"/><text x="282" y="134" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="282" y="190" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Read the label</text><text x="282" y="212" fill="#4A5A70" font-size="12" text-anchor="middle">Type, standard,</text><text x="282" y="229" fill="#4A5A70" font-size="12" text-anchor="middle">manufacture date</text><path stroke="#C9D3E0" stroke-width="2.5" d="M320 125h96"/><path fill="#C9D3E0" d="m416 125-8.104 3.915v-7.83Z"/><circle cx="454" cy="125" r="30" fill="#13294B"/><text x="454" y="134" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="454" y="190" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Press test</text><text x="454" y="212" fill="#4A5A70" font-size="12" text-anchor="middle">Hold 3 to 5 seconds,</text><text x="454" y="229" fill="#4A5A70" font-size="12" text-anchor="middle">use a pole if needed</text><path stroke="#C9D3E0" stroke-width="2.5" d="M492 125h96"/><path fill="#C9D3E0" d="m588 125-8.104 3.915v-7.83Z"/><circle cx="626" cy="125" r="30" fill="#13294B"/><text x="626" y="134" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="626" y="190" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Listen</text><text x="626" y="212" fill="#4A5A70" font-size="12" text-anchor="middle">Every other alarm</text><text x="626" y="229" fill="#4A5A70" font-size="12" text-anchor="middle">should sound too</text><path stroke="#C9D3E0" stroke-width="2.5" d="M664 125h96"/><path fill="#C9D3E0" d="m760 125-8.104 3.915v-7.83Z"/><circle cx="798" cy="125" r="30" fill="#13294B"/><text x="798" y="134" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">5</text><text x="798" y="190" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Clean</text><text x="798" y="212" fill="#4A5A70" font-size="12" text-anchor="middle">Vacuum or soft brush,</text><text x="798" y="229" fill="#4A5A70" font-size="12" text-anchor="middle">no sprays</text><path stroke="#C9D3E0" stroke-width="2.5" d="M836 125h96"/><path fill="#C9D3E0" d="m932 125-8.104 3.915v-7.83Z"/><circle cx="970" cy="125" r="30" fill="#FF6B35"/><text x="970" y="134" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">6</text><text x="970" y="190" fill="#13294B" font-size="15" font-weight="700" text-anchor="middle">Record</text><text x="970" y="212" fill="#4A5A70" font-size="12" text-anchor="middle">Log each alarm</text><text x="970" y="229" fill="#4A5A70" font-size="12" text-anchor="middle">before you leave</text></svg>